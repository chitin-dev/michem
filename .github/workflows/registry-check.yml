name: Registry release check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CHECKER_REV: 3abdb3cddc477fb00f75126bb26dd98dd90514c8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify release tag and manifest versions
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          manifest = tomllib.loads(Path("typst.toml").read_text())["package"]
          cargo = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]
          expected = "v" + manifest["version"]
          if os.environ["RELEASE_TAG"] != expected or cargo["version"] != manifest["version"]:
              raise SystemExit(f"Tag and both manifest versions must match {expected}")
          PY
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            . -> .temp/checker-target
      - uses: ./.github/actions/setup-rendering
      - name: Install official Registry checker
        run: |
          cargo install --git https://github.com/typst/package-check.git \
            --rev "$CHECKER_REV" --locked \
            --root .temp/checker --target-dir .temp/checker-target
      - name: Build and validate Registry submission
        run: |
          python3 scripts/prepare-release.py \
            --output .temp/ci/registry \
            --typst typst-min --typst typst \
            --checker .temp/checker/bin/typst-package-check
      - name: Assemble validated release attachments
        run: python3 scripts/release-assets.py .temp/ci/registry .temp/ci/attachments
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: .temp/ci/attachments/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
